name: Build CallKeeper
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'CallKeeper/**'
      - '.github/workflows/callkeeper.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run automated checks
        run: dotnet run --project CallKeeper/Checks/Checks.csproj -c Release
      - name: Build Windows executable
        run: dotnet publish CallKeeper/App/App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o release
      - name: Package application and guide
        shell: pwsh
        run: |
          Copy-Item CallKeeper/docs/User_Guide.txt release/Read_Me.txt
          Copy-Item CallKeeper/docs/Release_Notes_0.4.txt release/Release_Notes.txt
          Compress-Archive -Path release/CallKeeper.exe,release/Read_Me.txt,release/Release_Notes.txt -DestinationPath CallKeeper_0.4_Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CallKeeper-0.4-Windows-x64
          path: CallKeeper_0.4_Windows.zip
      - name: Publish version 0.4 download if not already released
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.4.0 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.4.0 CallKeeper_0.4_Windows.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "CallKeeper 0.4" --notes "Meeting Directory is now CallKeeper. Existing meetings and settings load automatically from the same local data folder. Close the older application before opening CallKeeper. Extract the ZIP and open CallKeeper.exe. Includes the user guide. Unsigned x64 build; reminders require the application to stay open. Automated checks passed; further hands-on screen-reader testing is encouraged."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
