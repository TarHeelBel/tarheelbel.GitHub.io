name: Build CallKeeper
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'CallKeeper/**'
      - '.github/workflows/callkeeper.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run automated checks
        run: dotnet run --project CallKeeper/Checks/Checks.csproj -c Release
      - name: Build Windows executable
        run: dotnet publish CallKeeper/App/App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o release
      - name: Package application and guide
        shell: pwsh
        run: |
          Copy-Item CallKeeper/docs/User_Guide.txt release/Read_Me.txt
          Copy-Item CallKeeper/docs/Release_Notes_0.6.2.txt release/Release_Notes.txt
          Copy-Item CallKeeper/docs/CSV_Import_Guide.txt release/CSV_Import_Guide.txt
          Copy-Item CallKeeper/templates/CallKeeper_Import_Template.csv release/CallKeeper_Import_Template.csv
          Copy-Item CallKeeper/templates/CallKeeper_Import_Template.xlsx release/CallKeeper_Import_Template.xlsx
          Compress-Archive -Path release/CallKeeper.exe,release/Read_Me.txt,release/Release_Notes.txt,release/CSV_Import_Guide.txt,release/CallKeeper_Import_Template.csv,release/CallKeeper_Import_Template.xlsx -DestinationPath CallKeeper_0.6.2_Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CallKeeper-0.6.2-Windows-x64
          path: CallKeeper_0.6.2_Windows.zip
      - name: Publish version 0.6.2 download if not already released
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.6.2 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.6.2 CallKeeper_0.6.2_Windows.zip CallKeeper/templates/CallKeeper_Import_Template.xlsx CallKeeper/templates/CallKeeper_Import_Template.csv --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "CallKeeper 0.6.2" --notes-file CallKeeper/docs/Release_Notes_0.6.2.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
