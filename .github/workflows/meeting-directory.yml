name: Build Meeting Directory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'MeetingDirectory/**'
      - '.github/workflows/meeting-directory.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run automated checks
        run: dotnet run --project MeetingDirectory/Checks/Checks.csproj -c Release
      - name: Build Windows executable
        run: dotnet publish MeetingDirectory/App/App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o release
      - name: Package application and guide
        shell: pwsh
        run: |
          Copy-Item MeetingDirectory/docs/User_Guide.txt release/Read_Me.txt
          Compress-Archive -Path release/MeetingDirectory.exe,release/Read_Me.txt -DestinationPath MeetingDirectory_0.3_Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MeetingDirectory-0.3-Windows-x64
          path: MeetingDirectory_0.3_Windows.zip
      - name: Publish version 0.3 download if not already released
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.3.0 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.3.0 MeetingDirectory_0.3_Windows.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Meeting Directory 0.3" --notes "Windows preview with File, Meeting, View and Help menus. Extract the ZIP and open MeetingDirectory.exe. Includes the user guide. Unsigned x64 build; reminders require the application to stay open. Automated checks passed; further hands-on screen-reader testing is encouraged."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
